<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeetAI | Video Meeting</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
        }

        .meeting-info {
            font-size: 14px;
            color: #64748b;
        }

        main {
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .meeting-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .meeting-heading h1 {
            font-size: 23px;
            margin: 0 0 8px;
        }

        .meeting-heading p {
            color: #64748b;
            margin: 0;
        }

        button {
            border: none;
            padding: 12px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-button {
            background: #2563eb;
            color: white;
        }

        #meeting-room {
            height: 72vh;
            min-height: 450px;
            background: #0f172a;
            border-radius: 15px;
            overflow: hidden;
        }

        #meeting-status {
            padding: 15px 5px;
            color: #64748b;
            font-size: 13px;
        }

        .back-button {
            color: #2563eb;
            background: #eff6ff;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 15px;
            }

            main {
                padding: 12px;
            }

            #meeting-room {
                height: 70vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MeetAI</div>
        <button class="back-button" id="backButton">
            ← Dashboard
        </button>
    </header>

    <main>
        <div class="meeting-heading">
            <div>
                <h1>Video Meeting</h1>
                <p id="meeting-code">Preparing your meeting...</p>
            </div>

            <button class="copy-button" id="copyButton">
                Copy Meeting Link
            </button>
        </div>

        <div id="meeting-room"></div>

        <p id="meeting-status" role="status">
            Connecting to the meeting service...
        </p>
    </main>

    <script src="https://meet.jit.si/external_api.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);

        let roomName = params.get("room");

        if (!roomName) {
            roomName = "MeetAI-" +
                Math.random().toString(36).substring(2, 10);
        }

        document.getElementById("meeting-code").textContent =
            "Meeting code: " + roomName;

        document.getElementById("copyButton").addEventListener(
            "click",
            async function () {
                const meetingLink = window.location.origin +
                    window.location.pathname +
                    "?room=" + encodeURIComponent(roomName);

                try {
                    await navigator.clipboard.writeText(meetingLink);

                    alert("Meeting link copied!");
                } catch (error) {
                    prompt("Copy this meeting link:", meetingLink);
                }
            }
        );

        document.getElementById("backButton").addEventListener(
            "click",
            function () {
                window.location.href = "index.html";
            }
        );

        if (typeof JitsiMeetExternalAPI === "undefined") {
            document.getElementById("meeting-status").textContent =
                "The meeting service could not load. Check your internet connection and refresh the page.";
        } else {
            try {
                const api = new JitsiMeetExternalAPI(
                    "meet.jit.si",
                    {
                        roomName: roomName,
                        parentNode: document.getElementById("meeting-room"),
                        width: "100%",
                        height: "100%",

                        userInfo: {
                            displayName: "MeetAI Participant"
                        },

                        configOverwrite: {
                            prejoinConfig: {
                                enabled: true
                            }
                        },

                        lang: "en"
                    }
                );

                api.addEventListener(
                    "videoConferenceJoined",
                    function () {
                        document.getElementById("meeting-status").textContent =
                            "You have joined the meeting.";
                    }
                );

                api.addEventListener(
                    "videoConferenceLeft",
                    function () {
                        document.getElementById("meeting-status").textContent =
                            "You have left the meeting.";
                    }
                );

                api.addEventListener(
                    "errorOccurred",
                    function () {
                        document.getElementById("meeting-status").textContent =
                            "A meeting error occurred. Please try refreshing the page.";
                    }
                );

                window.addEventListener("beforeunload", function () {
                    api.dispose();
                });

            } catch (error) {
                document.getElementById("meeting-status").textContent =
                    "Unable to start the meeting. Please refresh and try again.";
            }
        }
    </script>

</body>
</html>
